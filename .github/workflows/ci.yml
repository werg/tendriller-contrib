name: Contrib artifacts
on:
  push:
  create:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  check:
    if: github.event_name != 'create' || (github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/v'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.15.0', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - if: matrix.node == '24'
        run: npx playwright install --with-deps chromium firefox webkit
      - if: matrix.node == '24'
        run: npm run test:components && npm run test:preview && npm run test:portable
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: contrib-failures-${{ matrix.node }}
          path: test-results/
  release:
    if: >-
      (github.event_name != 'create' || github.event.ref_type == 'branch') &&
      (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v'))
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: contrib-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install and verify the public core release
        run: npm run core:install
      - run: npm run build
        env:
          SOURCE_COMMIT: ${{ github.sha }}
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref }}
        run: node distribution/publish-release.mjs "$RELEASE_REF"
