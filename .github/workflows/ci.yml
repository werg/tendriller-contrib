name: Cookbook collection
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.15.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          SOURCE_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: matrix.node == '24'
        with:
          name: cookbook-content
          path: |
            dist/manifest.json
            dist/tendriller-cookbooks-*.tgz
            dist/static/
