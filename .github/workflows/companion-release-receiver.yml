name: Propose qualified companion release

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: companion-release-receiver
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify public graph and propose this repository's tuple update
        env:
          GH_TOKEN: ${{ github.token }}
        run: node distribution/release-automation/companion-release/cli.mjs --receiver contrib --output "$RUNNER_TEMP/companion-release" --apply --auth-kind repository
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: companion-release-proposal
          path: ${{ runner.temp }}/companion-release/*.json
