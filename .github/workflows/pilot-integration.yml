name: Cookbook public-artifact integration
on:
  push:
    paths:
      - 'cookbooks/**/checks/**'
      - 'cookbooks/**/snippets/**'
      - 'test/pilot-browser.mjs'
      - '.github/workflows/pilot-integration.yml'
  pull_request:
    paths:
      - 'cookbooks/**/checks/**'
      - 'cookbooks/**/snippets/**'
      - 'test/pilot-browser.mjs'
      - '.github/workflows/pilot-integration.yml'
  workflow_dispatch:
    inputs:
      core_ref:
        description: Exact public core commit to build and exercise
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: cookbook-pilots-${{ github.head_ref || github.ref_name }}-${{ inputs.core_ref || 'pinned' }}
  cancel-in-progress: true
jobs:
  pilots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # A one-way test pairing, not a prose/release compatibility requirement.
      CORE_CHECK_REF: ${{ inputs.core_ref || 'c248ceeabfd210538f445d5f889f7cc166f081b1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/checkout@v4
        with:
          repository: werg/tendriller
          ref: ${{ env.CORE_CHECK_REF }}
          path: .core-build
      - name: Build public core artifacts
        id: artifacts
        working-directory: .core-build
        run: npm ci && npm run build:artifacts
      - name: Install browser used by the public-artifact checks
        working-directory: .core-build
        run: npx playwright install --with-deps chromium
      - name: Exercise independent page adaptations against the public preview artifact
        run: node test/pilot-browser.mjs --tools .core-build/dist/tools --playwright .core-build/node_modules/playwright/index.mjs
      - name: Exercise trusted references against the packaged actual host
        if: ${{ !cancelled() && steps.artifacts.outcome == 'success' }}
        run: node cookbooks/collect-private-responses/checks/run-host.mjs --artifacts .core-build/dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cookbook-pilot-evidence
          path: test-results/
