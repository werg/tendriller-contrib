name: Released-Artifact Cross-OS Qualification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  released-artifacts:
    name: ${{ matrix.os }} / Node ${{ matrix.node }} (no native toolchain)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.15.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies with lifecycle scripts disabled
        run: npm ci --ignore-scripts

      - name: Verify zero native compiler, Emscripten, or Docker invocation
        shell: bash
        run: |
          # Construct a clean toolchain-free PATH retaining Node/npm and basic POSIX utils only.
          NODE_DIR="$(dirname "$(command -v node)")"
          echo "Node path: $NODE_DIR"
          node --version
          npm run check
          npm run build
          node distribution/scorecard.mjs --verify-only

      - name: Verify cookbook archive integrity using pure Node
        run: |
          node -e "
            import { readFileSync } from 'node:fs';
            import { gunzipSync } from 'node:zlib';
            const manifest = JSON.parse(readFileSync('dist/manifest.json', 'utf8'));
            const tgz = readFileSync('dist/' + manifest.artifacts[0].file);
            const tar = gunzipSync(tgz);
            if (tar.byteLength < 1024) throw new Error('Invalid tar.gz archive');
            console.log('Verified pure-Node cookbook archive:', manifest.artifacts[0].file, tgz.byteLength, 'bytes');
          "
