<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Facilitator desk · specimen</title><style>:root{font:16px/1.55 system-ui;color:#252d36;background:#edf1f4}body{margin:0}main{max-width:82rem;margin:auto;padding:2rem}h1{font-size:2.5rem}.desk{display:grid;grid-template-columns:1.1fr .9fr;gap:2rem}section{background:white;border:1px solid #bcc9d0;padding:1.3rem;border-radius:.5rem}label{display:grid;gap:.5rem}textarea{font:inherit;min-height:14rem;padding:.8rem}button{font:inherit;padding:.65rem 1rem;border:1px solid #536d7c;border-radius:.3rem;background:#e0eaf0}article{border-bottom:1px solid #dce4e9;padding:.7rem 0}article h3{font-size:1rem}small{color:#526c7c}#status{min-height:2em}:focus-visible{outline:3px solid #a7641c;outline-offset:3px}@media(max-width:700px){.desk{grid-template-columns:1fr}main{padding:1rem}}</style><script type="module" src="app.mjs"></script></head><body><main><small>Private responses · independently authored facilitator console</small><h1>Review before sharing</h1><p id="round"></p><div class="desk"><section aria-labelledby="private-title"><h2 id="private-title">Authorized private review</h2><button id="refresh">Refresh current revision</button><div id="answers"></div></section><section><h2>Intentional shared result</h2><p>Write an aggregate that is appropriate for the group. Raw answers are never copied here automatically.</p><label>Reviewed summary<textarea id="summary"></textarea></label><p><button id="publish" disabled>Publish this reviewed summary</button> <button id="retry" hidden>Retry original publication</button> <button id="review-current" hidden>Discard original retry and review current revision</button></p><p id="published"></p></section></div><p id="status" role="status">Checking capability and authorization…</p></main></body></html>
