<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sketch review · adaptation specimen</title><link rel="stylesheet" href="style.css"><script type="module" src="app.mjs"></script></head><body><main><header><p>Independent fullscreen/canvas specimen</p><h1>Sketch the relationship</h1><button id="fullscreen">Use fullscreen</button></header><section id="drawing"><p>Draw with a pointer, add a rectangle with the keyboard, or describe the layout in text.</p><canvas id="canvas" width="900" height="440" role="img" aria-label="Your sketch; text description is available below"></canvas><div class="actions"><button id="rectangle">Add a rectangle</button><button id="clear">Clear drawing</button><button id="review-button">Review snapshot</button></div></section><section id="review" hidden><h2>Review this exact snapshot</h2><img id="snapshot" alt="Sketch snapshot to submit"><p>New drawing after this step does not change these reviewed bytes.</p><button id="retake">Return to drawing</button><button id="send">Send reviewed sketch</button></section><label>Explain the sketch<textarea id="description" placeholder="The smaller room opens into the courtyard…"></textarea></label><p id="status" role="status">Connecting…</p><section id="outcomes" aria-label="Sketch submission outcomes"></section></main></body></html>
